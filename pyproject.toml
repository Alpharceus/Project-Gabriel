[project]
name = "gabriel"
version = "0.1.0"
description = "A group chat for one person's devices and agents, over ntfy"
requires-python = ">=3.11"
dependencies = ["requests"]

[project.scripts]
gabriel = "gabriel.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gabriel"]
