[project]
name = "gabriel"
version = "0.1.0"
description = "A group chat for one person's devices and agents — E2E-encrypted over Firebase"
requires-python = ">=3.11"
dependencies = ["firebase-admin", "cryptography"]

[project.scripts]
gabriel = "gabriel.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gabriel"]
